# Fly.io deployment with persistent SQLite storage.

app = "vantage"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  TRUST_PROXY = "1"
  PORT = "8080"
  VANTAGE_DB = "/data/vantage.db"
  VANTAGE_DATA_MODE = "evaluation"

[[mounts]]
  source = "vantage_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"
