# Operator configuration. Store secrets in the hosting environment.

app:
  name: VANTAGE
  display_name: VANTAGE
  organization_name: Marine Corps
  data_mode: evaluation
  region: us

deployment:
  trust_proxy: false
  public_url: ''
  admin_url: ''

ui:
  palette: ocean-light
  default_theme: light
  announcement: ''

auth:
  provider: password
  password_enabled: true
  self_registration: true
  cac_piv:
    enabled: false
    subject_header: x-vantage-cac-subject
    username_header: x-vantage-cac-username
    first_name_header: x-vantage-cac-first-name
    last_name_header: x-vantage-cac-last-name
    verification_header: x-vantage-cac-verified
    verification_value: verified
    proxy_secret_header: x-vantage-proxy-secret
    # Required when CAC/PIV is enabled. The proxy must strip client-supplied
    # assertion headers and inject its own after mTLS verification.
    trusted_proxy_ips: []

sessions:
  idle_minutes: 60
  absolute_hours: 12
  max_active: 8

limits:
  mutations_per_15_minutes: 240
  registrations_per_15_minutes: 20
  max_records_per_user: 10000
  max_database_bytes: 786432000
  max_guest_days: 30

storage:
  database_path: vantage.db

attachments:
  enabled: true
  max_bytes: 10485760
  max_per_record: 10
  allowed_types: [application/pdf, image/jpeg, image/png, text/plain, text/csv]

retention:
  soft_delete: true
  purge_days: 0

experience_metrics:
  # Aggregate first-party counters only.
  enabled: true
  mode: first_party_aggregate

maradmins:
  enabled: true
  refresh_minutes: 30

integrations:
  # Disabled until an Instance Operator approves an exact-unit client.
  enabled: false
  requests_per_15_minutes: 600
