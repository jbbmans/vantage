    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>Vantage | Performance, Productivity & Readiness Software</title>

    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg?v=20260914" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260914" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/geist-normal.woff2" as="font" type="font/woff2" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vantage" />
    <meta property="og:title" content="Vantage | Performance, Productivity & Readiness Software" />
    <meta property="og:description" content="Turn operational work into clear, traceable performance, readiness, reporting, and decision-ready insight." />
    <meta property="og:url" content="https://vantageusmc.com/" />
    <meta property="og:image" content="https://vantageusmc.com/og.png" />
    <meta property="og:image:alt" content="Vantage performance, productivity and readiness platform" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vantage | Performance, Productivity & Readiness Software" />
    <meta name="twitter:description" content="A self-hosted workspace for work tracking, performance records, readiness, goals, reports, and team visibility." />
    <meta name="twitter:image" content="https://vantageusmc.com/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Vantage",
        "url": "https://vantageusmc.com/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "A self-hosted platform for operational work tracking, performance records, readiness, goals, correspondence, reporting, and team decision support.",
        "featureList": [
          "Performance and action tracking",
          "Readiness tracking",
          "Work and project management",
          "Spreadsheet-supported work queues",
          "Goals and measurable progress",
          "Correspondence tracking",
          "Reports and source-linked analysis",
          "Role-aware team visibility"
        ]
      }
    </script>

    <script>
      try {
        var mode = localStorage.getItem('vantage.theme') || 'light';
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var accent = localStorage.getItem('vantage.accent');
        if (accent) document.documentElement.setAttribute('data-accent', accent);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Vantage needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
