# Render Blueprint for Vantage. One Starter web service with a persistent disk; nothing else to pay for.
# Auto-deploys every push to main. First deploy: open the site, enter the setup token from the
# service's environment, create the owner account. See docs/deploy-render.md.
services:
  - type: web
    name: vantage
    runtime: docker
    plan: starter
    region: ohio
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    disk:
      name: vantage-data
      mountPath: /data
      sizeGB: 1
    domains:
      - vantageusmc.com
      - www.vantageusmc.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8787"
      - key: VANTAGE_DB
        value: /data/vantage.db
      - key: VANTAGE_PUBLIC_URL
        value: https://vantageusmc.com
      - key: TRUST_PROXY
        value: "true"
      - key: VANTAGE_TIMEZONE
        value: America/New_York
      - key: VANTAGE_SECRET
        generateValue: true
      - key: VANTAGE_SETUP_TOKEN
        generateValue: true
      - key: VANTAGE_SELF_REGISTRATION
        value: "false"
      - key: VANTAGE_MARADMIN_ENABLED
        value: "true"
      # Email (optional). Set the provider and its credential in the dashboard; see docs/email.md.
      - key: VANTAGE_EMAIL_PROVIDER
        value: none
      - key: VANTAGE_EMAIL_FROM
        value: "Vantage <no-reply@vantageusmc.com>"
      - key: RESEND_API_KEY
        sync: false
      # GenAI.mil (optional). The key never reaches the browser.
      - key: VANTAGE_AI_ENABLED
        value: "false"
      - key: VANTAGE_GENAI_API_KEY
        sync: false
      - key: VANTAGE_GENAI_BASE_URL
        value: https://api.genai.mil/v1
      - key: VANTAGE_GENAI_MODELS
        value: gemini-2.5-flash,gemini-2.5-pro
