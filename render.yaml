services:
  - type: web
    name: vantage
    runtime: docker
    region: ohio
    dockerfilePath: ./Dockerfile
    plan: starter
    numInstances: 1
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    domains:
      - vantageusmc.com
      - admin.vantageusmc.com
    renderSubdomainPolicy: disabled
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PORT
        value: 8080
      - key: VANTAGE_DB
        value: /data/vantage.db
      - key: VANTAGE_DATA_MODE
        value: evaluation
      - key: VANTAGE_PUBLIC_URL
        value: https://vantageusmc.com
      - key: VANTAGE_ADMIN_URL
        value: https://admin.vantageusmc.com
      - key: VANTAGE_SETUP_TOKEN
        generateValue: true
      - key: VANTAGE_OPERATOR
        sync: false
      - key: VANTAGE_OPERATOR_ID
        sync: false
    disk:
      name: vantage-data
      mountPath: /data
      sizeGB: 1
