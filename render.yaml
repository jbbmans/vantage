# Vantage on Render.
#
# The disk is what makes the data survive a deploy. Render mounts it before the
# process starts, so VANTAGE_DB can point straight at it.

services:
  - type: web
    name: vantage
    runtime: docker
    region: ohio
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # One trusted proxy hop (Render's edge). See finding 18 / server/index.js.
      - key: TRUST_PROXY
        value: "1"
      - key: PORT
        value: 8080
      - key: VANTAGE_DB
        value: /data/vantage.db
      - key: VANTAGE_DATA_MODE
        value: evaluation
      - key: VANTAGE_SETUP_TOKEN
        generateValue: true
      # Set this to the bootstrap username in the Render dashboard. It is not a
      # global role; it names the infrastructure recovery operator explicitly.
      - key: VANTAGE_OPERATOR
        sync: false
      # Preferred after first setup: copy the bootstrap account UUID from
      # /api/me, set it here, and remove the username fallback.
      - key: VANTAGE_OPERATOR_ID
        sync: false
    disk:
      name: vantage-data
      mountPath: /data
      sizeGB: 1
