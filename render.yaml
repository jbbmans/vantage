# LEGACY DEPLOYMENT. This blueprint runs the pre-MCEN public site at vantageusmc.com, and it keeps running until the
# site is retired. It is not the production target: production is MCEN (docs/deploy-mcen.md, ADR-0007).
services:
  - type: web
    name: vantage
    runtime: docker
    plan: starter
    region: ohio
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    buildFilter:
      ignoredPaths:
        - docs/**
        - film/**
        - tests/**
        - .github/**
        - "**/*.md"
    disk:
      name: vantage-data
      mountPath: /data
      sizeGB: 1
    # www first: Render then adds the bare vantageusmc.com and redirects it to www. See docs/deploy-render.md.
    domains:
      - www.vantageusmc.com
      - secure.vantageusmc.com
      - dev.vantageusmc.com
    envVars:
      - key: NODE_ENV
        value: production
      # The public site's own rules: a public page, Cloudflare, Resend and IndexNow. The mcen profile refuses all four.
      - key: VANTAGE_DEPLOYMENT_PROFILE
        value: legacy-public
      - key: PORT
        value: "8787"
      - key: VANTAGE_DB
        value: /data/vantage.db
      # One address serves everything until the three below are set. Set them in the dashboard, not here, once
      # secure. and dev. resolve and have certificates; set here, a merge would send people to addresses that do
      # not exist yet. See docs/deploy-render.md, "Moving vantageusmc.com to three addresses".
      - key: VANTAGE_PUBLIC_URL
        value: https://vantageusmc.com
      # https://www.vantageusmc.com: the public page.
      - key: VANTAGE_SITE_URL
        sync: false
      # https://secure.vantageusmc.com: sign-in and the app. Email links point here.
      - key: VANTAGE_APP_URL
        sync: false
      # https://dev.vantageusmc.com: the owner console; administration answers here alone.
      - key: VANTAGE_CONSOLE_URL
        sync: false
      # vantageusmc.com: passkeys belong to the domain, so one works on the app and the console, and none made
      # before the split has to be registered again.
      - key: VANTAGE_RP_ID
        sync: false
      - key: TRUST_PROXY
        value: "true"
      # The site is served through Cloudflare: rate limits and the audit trail use the visitor's address from
      # CF-Connecting-IP, accepted only from Cloudflare's own edge addresses (server/lib/http.ts).
      - key: VANTAGE_CLIENT_IP
        value: cloudflare
      # Optional: an address for vulnerability reports, listed first in /.well-known/security.txt.
      - key: VANTAGE_SECURITY_CONTACT
        sync: false
      - key: VANTAGE_TIMEZONE
        value: America/Chicago
      - key: VANTAGE_SECRET
        generateValue: true
      - key: VANTAGE_SETUP_TOKEN
        generateValue: true
      - key: VANTAGE_SELF_REGISTRATION
        value: "false"
      - key: VANTAGE_MARADMIN_ENABLED
        value: "true"
      # Tell Bing (and so Edge, DuckDuckGo and Yahoo), Yandex and the other IndexNow engines when the public page changes.
      - key: VANTAGE_INDEXNOW
        value: "true"
      # Ownership tokens from Google Search Console and Bing Webmaster Tools (the meta-tag method). See docs/seo.md.
      - key: VANTAGE_GOOGLE_SITE_VERIFICATION
        sync: false
      - key: VANTAGE_BING_SITE_VERIFICATION
        sync: false
      - key: VANTAGE_EMAIL_PROVIDER
        # Keep the verified route until direct SMTP and domain authentication pass in production.
        value: resend
      - key: VANTAGE_EMAIL_FROM
        value: "Vantage <no-reply@vantageusmc.com>"
      - key: VANTAGE_EMAIL_REPLY_TO
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: VANTAGE_AI_ENABLED
        value: "true"
      - key: VANTAGE_GENAI_API_KEY
        sync: false
      - key: VANTAGE_GENAI_BASE_URL
        value: https://api.genai.mil/v1
      - key: VANTAGE_GENAI_MODELS
        value: gemini-2.5-flash,gemini-2.5-pro
      - key: VANTAGE_M365_CLIENT_ID
        sync: false
      - key: VANTAGE_M365_CLIENT_SECRET
        sync: false
      - key: VANTAGE_M365_TENANT
        value: organizations
