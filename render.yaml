services:
  - type: web
    name: vantage
    runtime: docker
    plan: starter
    region: ohio
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    buildFilter:
      ignoredPaths:
        - docs/**
        - film/**
        - tests/**
        - .github/**
        - "**/*.md"
    disk:
      name: vantage-data
      mountPath: /data
      sizeGB: 1
    # www first: Render then adds the bare vantageusmc.com and redirects it to www. See docs/deploy-render.md.
    domains:
      - www.vantageusmc.com
      - secure.vantageusmc.com
      - dev.vantageusmc.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8787"
      - key: VANTAGE_DB
        value: /data/vantage.db
      # The three faces of Vantage: the public site, the app (sign-in and the tool) and the owner console.
      # Email links go to the app; search engines are told about the site; administration answers only on the console.
      - key: VANTAGE_SITE_URL
        value: https://www.vantageusmc.com
      - key: VANTAGE_APP_URL
        value: https://secure.vantageusmc.com
      - key: VANTAGE_CONSOLE_URL
        value: https://dev.vantageusmc.com
      # Passkeys belong to this domain, so one made on the app also works on the console. It is what they were made
      # under before the split, so none has to be registered again.
      - key: VANTAGE_RP_ID
        value: vantageusmc.com
      - key: TRUST_PROXY
        value: "true"
      - key: VANTAGE_TIMEZONE
        value: America/Chicago
      - key: VANTAGE_SECRET
        generateValue: true
      - key: VANTAGE_SETUP_TOKEN
        generateValue: true
      - key: VANTAGE_SELF_REGISTRATION
        value: "false"
      - key: VANTAGE_MARADMIN_ENABLED
        value: "true"
      # Tell Bing (and so Edge, DuckDuckGo and Yahoo), Yandex and the other IndexNow engines when the public page changes.
      - key: VANTAGE_INDEXNOW
        value: "true"
      # Ownership tokens from Google Search Console and Bing Webmaster Tools (the meta-tag method). See docs/seo.md.
      - key: VANTAGE_GOOGLE_SITE_VERIFICATION
        sync: false
      - key: VANTAGE_BING_SITE_VERIFICATION
        sync: false
      - key: VANTAGE_EMAIL_PROVIDER
        # Keep the verified route until direct SMTP and domain authentication pass in production.
        value: resend
      - key: VANTAGE_EMAIL_FROM
        value: "Vantage <no-reply@vantageusmc.com>"
      - key: VANTAGE_EMAIL_REPLY_TO
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: VANTAGE_AI_ENABLED
        value: "true"
      - key: VANTAGE_GENAI_API_KEY
        sync: false
      - key: VANTAGE_GENAI_BASE_URL
        value: https://api.genai.mil/v1
      - key: VANTAGE_GENAI_MODELS
        value: gemini-2.5-flash,gemini-2.5-pro
      - key: VANTAGE_M365_CLIENT_ID
        sync: false
      - key: VANTAGE_M365_CLIENT_SECRET
        sync: false
      - key: VANTAGE_M365_TENANT
        value: organizations
