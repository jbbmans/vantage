services:
  - type: web
    name: vantage
    runtime: docker
    plan: starter
    region: ohio
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    buildFilter:
      ignoredPaths:
        - docs/**
        - film/**
        - tests/**
        - .github/**
        - "**/*.md"
    disk:
      name: vantage-data
      mountPath: /data
      sizeGB: 1
    domains:
      - vantageusmc.com
      - www.vantageusmc.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8787"
      - key: VANTAGE_DB
        value: /data/vantage.db
      - key: VANTAGE_PUBLIC_URL
        value: https://vantageusmc.com
      - key: TRUST_PROXY
        value: "true"
      - key: VANTAGE_TIMEZONE
        value: America/New_York
      - key: VANTAGE_SECRET
        generateValue: true
      - key: VANTAGE_SETUP_TOKEN
        generateValue: true
      - key: VANTAGE_SELF_REGISTRATION
        value: "false"
      - key: VANTAGE_MARADMIN_ENABLED
        value: "true"
      - key: VANTAGE_EMAIL_PROVIDER
        value: direct
      - key: VANTAGE_EMAIL_FROM
        value: "Vantage <no-reply@vantageusmc.com>"
      - key: VANTAGE_EMAIL_REPLY_TO
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: VANTAGE_AI_ENABLED
        value: "true"
      - key: VANTAGE_GENAI_API_KEY
        sync: false
      - key: VANTAGE_GENAI_BASE_URL
        value: https://api.genai.mil/v1
      - key: VANTAGE_GENAI_MODELS
        value: gemini-2.5-flash,gemini-2.5-pro
      - key: VANTAGE_M365_CLIENT_ID
        sync: false
      - key: VANTAGE_M365_CLIENT_SECRET
        sync: false
      - key: VANTAGE_M365_TENANT
        value: organizations
